services:
  cassandra1:
    image: cassandra:5.0
    container_name: project1-cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: project1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_DC: dc1
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042"]
      interval: 20s
      timeout: 10s
      retries: 20

  cassandra2:
    image: cassandra:5.0
    container_name: project1-cassandra2
    environment:
      CASSANDRA_CLUSTER_NAME: project1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_DC: dc1
    depends_on:
      cassandra1:
        condition: service_healthy

  cassandra3:
    image: cassandra:5.0
    container_name: project1-cassandra3
    environment:
      CASSANDRA_CLUSTER_NAME: project1
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_DC: dc1
    depends_on:
      cassandra1:
        condition: service_healthy
