name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: python -m project1.cli trajectories/ryw_pass.json

  real-cassandra:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,cassandra]"

      - name: Start Cassandra cluster
        run: docker compose up -d

      - name: Run real Cassandra experiments
        run: python scripts/run_real_experiments.py

      - name: Show cluster logs on failure
        if: failure()
        run: |
          docker compose ps
          docker logs --tail 200 project1-cassandra1
          docker logs --tail 200 project1-cassandra2
          docker logs --tail 200 project1-cassandra3

      - name: Stop Cassandra cluster
        if: always()
        run: docker compose down
